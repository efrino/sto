org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Kompilasi incremental Kotlin dimatikan.
#
# Proyek ini ada di D: sedangkan pub cache (sumber Kotlin milik plugin, mis.
# mobile_scanner) ada di C:. Cache incremental Kotlin memakai path relatif,
# sehingga beda drive membuatnya gagal:
#   IllegalArgumentException: this and base files have different roots
# Build tetap berhasil karena Kotlin mundur ke mode non-incremental, tetapi
# konsol dibanjiri stack trace "Daemon compilation failed: null".
#
# Efeknya: build modul Kotlin selalu penuh (beberapa detik lebih lama), tetapi
# outputnya bersih dan tidak menyesatkan saat mencari error yang sebenarnya.
# Bisa dihapus bila nanti proyek dan pub cache berada di drive yang sama.
kotlin.incremental=false
